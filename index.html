<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLC Accelerate 2026 Workshop</title>
    <style>
        :root { --ivory:#faf9f5; --slate:#141413; --blue:#315c7c; --clay:#d97757; --line:#d1cfc5; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ivory); color:var(--slate); font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
        main { width:min(680px,calc(100% - 40px)); padding:48px 36px; border:1px solid var(--line); border-top:4px solid var(--clay); background:#fff; }
        h1 { margin:0 0 20px; font:500 clamp(2.2rem,6vw,3.5rem)/1.1 Georgia,"Times New Roman",serif; }
        p { margin:0 0 28px; }
        .button { display:inline-flex; align-items:center; min-height:48px; padding:12px 18px; border-radius:3px; background:var(--blue); color:#fff; font-weight:600; text-decoration:none; }
        .button:hover { text-decoration:underline; text-underline-offset:4px; }
        .button:focus-visible { outline:3px solid var(--clay); outline-offset:3px; }
    </style>
</head>
<body>
<main>
    <h1>Build an accessible accordion</h1>
    <p>Use the interactive Accordion Builder to customize content, preview the result, and copy Canvas-ready HTML for your LMS.</p>
    <a class="button" href="accordion%20builder.html">Open Accordion Builder</a>
</main>
</body>
</html>
